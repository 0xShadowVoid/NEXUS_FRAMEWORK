# NEXUS main configuration
# ${VAR} values resolve from config/.keys.env then OS environment.

scanning:
  default_intensity: quick-scan
  tool_timeout_seconds: 300
  rate_limit_default: "50/minute"
  request_budget: 0            # 0 = unlimited; positive N caps requests/scan
  probe_max_urls: 50           # HTTP collector budget per scan
  ssrf_allow: []               # hosts explicitly permitted despite private IPs
  dorking_engines: [duckduckgo, github]   # scraping engines are OFF by default

phases:
  discover:
    enabled: true
    tools: [pegpon, bbot, meg, wappalyzer]
  probe:
    enabled: true
    default_tools: [nuclei, dalfox]
  hunt:
    enabled: false                    # OFF by default
    intensity: quick-scan
    max_scans_per_day: 5
    alert_on: [P1, P2]
    vdp_strategy: light_scan
    bb_strategy: quick-scan
  control:
    enabled: false                    # C2 bot off by default
  scale:
    enabled: false                    # scaffold only
  network:
    enabled: true                     # gate still requires deep profile + explicit ip scope
    ports: []                         # explicit ports/ranges; empty = conservative default set
    concurrency: 16                   # low by default
    connect_timeout: 1.5
    probe_timeout: 2.0
    max_ports: 512
    allow_private: false              # private/loopback/link-local need explicit in-scope grants too
  cloud:
    enabled: true                     # gate still requires explicit cloud scope (scope_kind)
    providers: []                     # explicit provider selection: aws/azure/gcp; empty = none
    accounts: {}                      # per-provider account/project/subscription allowlists; fails closed when empty
    max_resources: 200                # per-section resource cap
    region: ""                        # optional AWS/regional hint
    project: ""                       # optional GCP project hint

targets:
  paypal.com:
    intensity: full-scan
    tools: [nuclei, dalfox, sqlmap]
    rate_limit: "50/minute"
  startup.com:
    intensity: quick-scan
    tools: [nuclei, dalfox]
    rate_limit: "100/minute"
  # Scope auto-sync (roadmap E1): give a target a `sync:` block, then run
  # `nexus scope-sync --program <domain>` or `--all` to pull its published
  # in/out-of-scope from the platform API into this file (a .bak is kept).
  # Credentials are referenced by env var NAME only and never stored here.
  # acme.com:
  #   intensity: full-scan
  #   sync:
  #     platform: hackerone        # hackerone | bugcrowd
  #     handle: acme               # program handle/slug on the platform
  #     username_env: H1_API_USER  # hackerone only
  #     token_env: H1_API_TOKEN    # api-token env var NAME

# Scope-drift alerts (roadmap E3): when a scope auto-sync changes a target's
# scope, notify through the channels below. Off by default; enable globally
# here or per run with `nexus scope-sync --all --notify`. An alert never
# broadens authorized scope on its own — it only reports the observed change.
scope_sync:
  notify:
    enabled: false
    discord: true       # Discord findings webhook
    telegram: true      # Telegram bot
    email: false        # SMTP (see email: below)

schedules:
  paypal_daily:
    target: paypal.com
    frequency: daily
    time: "02:00"
    intensity: full-scan

webhooks:
  discord:
    findings: ${DISCORD_FINDINGS_WEBHOOK}
    cve: ${DISCORD_CVE_WEBHOOK}
    metrics: ${DISCORD_METRICS_WEBHOOK}
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

email:
  smtp_host: ${SMTP_HOST}
  smtp_port: ${SMTP_PORT}
  smtp_user: ${SMTP_USER}
  smtp_pass: ${SMTP_PASS}
  from_addr: ${ALERT_EMAIL_FROM}
  to_addrs: ${ALERT_EMAIL_TO}

ai:
  provider: openai            # openai | glm | deepseek | gemini | kimi | openrouter | custom
  fallback_providers: [glm, deepseek, gemini, kimi, openrouter]   # tried in order
  model: ""                   # empty = provider default
  strong_model: ""            # used for chain reasoning / report writing
  max_calls: 0                # per-run AI call budget (0 = unlimited)
  base_url: ""                # optional override (or CUSTOM_BASE_URL / <PROVIDER>_BASE_URL)
  # reasoning_effort: ""      # off | low | medium | high (openai/openrouter only)
  # max_retries: 2            # bounded same-provider retries on transient errors
  # timeout_seconds: 60       # per-request read timeout

cve:
  auto_update: true
  frequency: daily
  time: "02:00"
  alert_severity: [critical, high]
  script_delivery: [email, discord]
  use_kev: true                # CISA known-exploited prioritisation
  use_epss: true               # EPSS exploitation-probability scoring

c2_bot:
  enabled: true
  use_same_webhook: true
  channels: [discord, telegram]

nemesis:
  enabled: true              # additive reasoning layer; optional parts stay OFF
  memory:
    enabled: true            # local SQLite engagement memory (no external services)
  skills:
    enabled: []              # NO skill is auto-enabled; list names to activate
  browser:
    enabled: false           # real browser automation (Playwright) — off by default
  mcp:
    enabled: false           # external MCP tools — off by default
  # Per-agent AI settings (optional). When present, `nexus agent --agent <name>`
  # selects the provider/model/effort chain. Verified providers only; unknown
  # or unverified providers (e.g. opencode/cline) are rejected at startup.
  # agents:
  #   default:
  #     provider: gemini
  #     model: gemini-1.5-flash
  #     reasoning_effort: ""          # off | low | medium | high (provider-dependent)
  #     timeout_seconds: 60
  #     max_retries: 2
  #     max_calls: 20
  #     fallback:                     # ordered provider/model fallbacks
  #       - {provider: openai, model: gpt-4o-mini}
  #       - {provider: openrouter}
  #   runtime:                        # bounded multi-agent runtime (`nexus team`)
  #     max_workers: 2                # parallel workers
  #     max_tasks: 25                 # cap on plan size
  #     timeout_seconds: 0            # whole-run wall clock (0 = unlimited)
  #     max_calls: 0                  # worker invocations (0 = unlimited)
  #     max_tokens: 0                 # token budget (0 = unlimited)
  #     max_retries: 1                # default per-task retries
  #     destructive_actions: [scan, exploit]   # require explicit approval
  #     roles:                        # restrict (never expand) a role's actions
  #       recon: {actions: [discover, dork, scan]}
  #       analysis: {actions: [scan, verify]}

results:
  base_dir: results
  exports_dir: exports

# Third-party security-tool integrations (adapters). OFF by default; each
# action still passes NEXUS scope + authorization + budget controls.
integrations:
  zap:
    enabled: false               # opt-in; nothing runs until enabled
    base_url: http://127.0.0.1:8080   # a running ZAP instance (daemon/API)
    api_key_env: ZAP_API_KEY     # env var NAME holding the API key (never inline)
    timeout_seconds: 30
    allow_active_scan: false     # intrusive (ascan) stays off unless true + per-run --authorize-active
    ssrf_allow: []               # extra hosts if ZAP is remote (e.g. [zap.internal])
  burp:
    enabled: false               # Burp Suite Professional REST API (Settings > Suite > REST API)
    base_url: http://127.0.0.1:1337   # a running Burp Pro instance; Community has no REST API
    api_key_env: BURP_API_KEY    # env var NAME holding the API key (the key is in the request path)
    timeout_seconds: 30
    allow_scan: false            # intrusive crawl+audit stays off unless true + per-run --authorize-active
    ssrf_allow: []               # extra hosts if Burp is remote (e.g. [burp.internal])
  caido:
    enabled: false               # Caido instance GraphQL API (read-only: findings + HTTP history)
    base_url: http://127.0.0.1:8080   # a running Caido instance (note: same default port as ZAP)
    api_key_env: CAIDO_PAT       # env var NAME holding a Personal Access Token / access token
    timeout_seconds: 30
    ssrf_allow: []               # extra hosts if Caido is remote (e.g. [caido.internal])

# Model Context Protocol (MCP) client (Task 21). OFF by default; every server
# must be explicitly enabled and every callable tool allowlisted. Servers are
# UNTRUSTED: NEXUS still enforces scope, SSRF, authorization, budgets, result
# bounds and redaction on every tool invocation. Secrets are referenced by env
# var NAME (auth_token_env) and are never written here.
mcp:
  enabled: false                 # master switch; no MCP server is contacted unless true
  servers: []                    # each server also needs enabled: true
  # Example (commented) — a local stdio server:
  # servers:
  #   - name: filesystem
  #     enabled: false
  #     transport: stdio         # stdio | streamable-http
  #     command: [npx, -y, "@modelcontextprotocol/server-filesystem", /data]  # argv list, no shell
  #     tools: [read_file, list_directory]   # per-server allowlist (empty = deny all)
  #     allow_active: false      # active/destructive tools need true + per-call --authorize-active
  #     timeout_seconds: 30
  #     max_result_bytes: 262144
  #     max_concurrency: 2
  #   - name: remote-tools
  #     enabled: false
  #     transport: streamable-http
  #     url: https://mcp.example.com/mcp
  #     auth_token_env: MCP_REMOTE_TOKEN    # env var NAME holding a bearer token (never inline)
  #     tools: [echo]
  #     ssrf_allow: []           # extra hosts if the endpoint is on a private network

database:
  path: nexus.db
