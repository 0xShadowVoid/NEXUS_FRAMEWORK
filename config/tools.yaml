# NEXUS Tool Registry — data-driven tool catalogue.
#
# Every tool is individually switchable ON/OFF via `enabled`. Tools that are
# not installed, or whose external provider key is missing, degrade
# gracefully: they are reported as unavailable and skipped (never fatal).
#
# Field reference (see lib/tool_registry.py):
#   enabled       bool      individual ON/OFF (profile defaults may override)
#   phase         which cycle the tool belongs to
#   domain        recon/osint/web/network/cloud/intel/auth/takeover/report
#   category      tool group used by phase cycles for selection
#   mode          light (quick-scan) | deep (full-scan only)
#   profiles      [minimal, standard, extended, deep, custom]
#   requires_tools  tools that must have run first (dependency order)
#   requires_provider  external provider that must have keys (OFF by default)
#   timeout       seconds; falls back to scanning.tool_timeout_seconds
#   retries       attempts on failure (deep mode honours this)
#   safety        safe | moderate | heavy (heavy = deep-only + gating)
#   parser        module:function that runs the tool (existing runners)
#   evidence_type what the tool yields for the filtration pipeline
#   capabilities  tags used for adaptive ("applicability") selection
#   builtin       true = ships with NEXUS (not an external binary)
#
# OVERLAPPING TOOLS ARE INTENTIONAL. NEXUS never deletes tools because they
# overlap; the filtration pipeline + unique-yield metrics decide which tools
# actually add attack surface.

profiles:
  # Profile → tool name membership. Resolved as: custom > CLI intensity >
  # profile defaults > per-tool `enabled`.
  minimal:
    tools: [subfinder, assetfinder, httpx, waybackurls, gau, nuclei, dalfox, arjun]
  standard:
    tools: [subfinder, assetfinder, httpx, waybackurls, gau, katana, dnsx, nuclei,
            dalfox, arjun, jsluice, jwt_tool, lfihunt, graphql_cop, waf_probe,
            cloudenum, ffuf, findomain, chaos, github_subdomains]
  extended:
    tools: [subfinder, assetfinder, httpx, waybackurls, gau, katana, dnsx, nuclei,
            dalfox, arjun, jsluice, jwt_tool, lfihunt, graphql_cop, waf_probe,
            cloudenum, ffuf, findomain, chaos, github_subdomains, amass, sublist3r,
            dnscan, hakrawler, gospider, gauplus, paramspider, subjs, linkfinder,
            trufflehog, nomore403, sqlmap, ghauri, commix, x8, kiterunner, sstimap,
            tinja, lfimap, ssrfmap, recollapse, subdominator, naabu]
  deep:
    tools: [subfinder, assetfinder, httpx, waybackurls, gau, katana, dnsx, nuclei,
            dalfox, arjun, jsluice, jwt_tool, lfihunt, graphql_cop, waf_probe,
            cloudenum, ffuf, findomain, chaos, github_subdomains, amass, sublist3r,
            dnscan, hakrawler, gospider, gauplus, paramspider, subjs, linkfinder,
            trufflehog, nomore403, sqlmap, ghauri, commix, x8, kiterunner, sstimap,
            tinja, lfimap, ssrfmap, recollapse, subdominator, naabu, nmap, bbot,
            sqlidetector, upload_bypass, pphack, forbidden, smugglex, http2smugl,
            graphw00f, clairvoyance, domdig, xssfuzz, cewl]
