[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-framework"
version = "2.0.1"
description = "NEXUS — Unified Bug Bounty Automation Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Custom permission-based (see LICENSE)" }
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "croniter>=2.0",
    "py7zr>=0.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
c2 = ["discord.py>=2.3", "python-telegram-bot>=20"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "httpx2>=2.0"]

[project.scripts]
nexus = "nexus:main"

[tool.setuptools]
py-modules = ["nexus"]
packages = [
    "lib",
    "core",
    "phases",
    "phases.discover",
    "phases.probe",
    "phases.analyze",
    "phases.hunt",
    "phases.control",
    "phases.scale",
    "phases.verify",
    "phases.auth",
    "phases.cloud",
    "phases.network",
    "phases.takeover",
    "lib.nemesis",
]
include-package-data = true

[tool.setuptools.data-files]
"config" = ["config/nexus.yaml", "config/tools.yaml", "config/methodologies.yaml", "config/false_positive_filters.yaml", "config/.keys.env.example"]
"skills" = ["skills/idor.yaml", "skills/jwt.yaml", "skills/recon.yaml", "skills/report.yaml", "skills/triage.yaml", "skills/web_hunt.yaml"]
"templates/reports" = ["templates/reports/bugcrowd.md", "templates/reports/generic.md", "templates/reports/hackerone.md", "templates/reports/intigriti.md"]
"templates/nuclei-custom" = ["templates/nuclei-custom/readme.md"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
